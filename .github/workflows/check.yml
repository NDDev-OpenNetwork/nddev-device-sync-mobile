name: NDS checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 4
jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: macos-15
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - if: runner.os == 'Linux'
        run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --mobile . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --mobile . --verify
      - id: desktop
        run: python scripts/desktop-source.py
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-desktop
          ref: ${{ steps.desktop.outputs.sha }}
          path: vendor/desktop
          persist-credentials: false
      - run: python vendor/desktop/scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Native Android toolchain
        if: matrix.target == 'android'
        shell: bash
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          rustup target add --toolchain 1.99.0 aarch64-linux-android x86_64-linux-android
          flutter config --android-sdk "$ANDROID_HOME" --jdk-dir "$JAVA_HOME_21_X64"
      - name: Native iOS targets
        if: matrix.target == 'ios'
        run: rustup target add --toolchain 1.99.0 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze --no-pub
      - name: Native Android compilation and lints
        if: matrix.target == 'android'
        shell: bash
        run: |
          export CC_aarch64_linux_android="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CC_x86_64_linux_android="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export AR_aarch64_linux_android="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$AR_aarch64_linux_android"
          cargo +1.99.0 clippy --manifest-path vendor/desktop/packages/nds_native/rust/Cargo.toml --locked --all-targets --target aarch64-linux-android -- -D warnings
          cargo +1.99.0 clippy --manifest-path vendor/desktop/packages/nds_native/rust/Cargo.toml --locked --all-targets --target x86_64-linux-android -- -D warnings
      - name: Android ARM64 app
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/build.py apk --debug --target-platform android-arm64
      - name: Android artifact boundary
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/check-artifact.py build/app/outputs/flutter-apk/app-debug.apk --native-source-commit ${{ steps.desktop.outputs.sha }}
      - name: Android wrapper/native provenance
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/build-provenance.py build/app/outputs/flutter-apk/app-debug.apk --output build/nds-android-provenance.json
      - name: iOS simulator build
        if: matrix.target == 'ios'
        run: python vendor/desktop/scripts/build.py ios --simulator --debug --no-codesign
      - name: iOS simulator artifact boundary
        if: matrix.target == 'ios'
        run: python vendor/desktop/scripts/check-artifact.py build/ios/iphonesimulator --native-source-commit ${{ steps.desktop.outputs.sha }}
      - name: iOS simulator wrapper/native provenance
        if: matrix.target == 'ios'
        run: python vendor/desktop/scripts/build-provenance.py build/ios/iphonesimulator --output build/nds-ios-simulator-provenance.json
      - name: Unsigned iOS device build
        if: matrix.target == 'ios'
        run: python vendor/desktop/scripts/build.py ios --debug --no-codesign
      - name: iOS device artifact boundary
        if: matrix.target == 'ios'
        run: python vendor/desktop/scripts/check-artifact.py build/ios/iphoneos --native-source-commit ${{ steps.desktop.outputs.sha }}
      - name: iOS device wrapper/native provenance
        if: matrix.target == 'ios'
        run: python vendor/desktop/scripts/build-provenance.py build/ios/iphoneos --output build/nds-ios-device-provenance.json
  quality:
    if: always()
    needs: [builds]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.builds.result }}' = success
